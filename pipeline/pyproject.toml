[project]
name = "busanalytics-pipeline"
version = "0.1.0"
description = "HCMC Bus Analytics — data pipeline (Bronze/Silver/Gold warehouse build)"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "polars>=1.6", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[project.scripts]
busanalytics-pipeline = "busanalytics_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busanalytics_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
